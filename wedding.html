
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Wedding Reservation</title>
</head>
<body>
    <!-- Back Arrow Button -->
    <a href="index.html" class="back-button">
        &#8592;
    </a>

    <!-- Booking Form -->
    <div class="container">
        <h1>Event Reservation</h1>
        <form id="weddingForm">
            <label for="event">Event Name:</label><br>
            <input type="text" id="event" name="event" required><br><br>

            <label for="name">Client Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>
            
            <label for="date">Date:</label><br>
            <input type="date" id="date" name="date" required placeholder="yyyy-mm-dd" min="1900-01-01" max="2099-12-31">

            <label for="guests">Number of Guests:</label><br>
            <input type="number" id="guests" name="guests" required><br><br>

            <label for="venue">Preferred Venue:</label><br>
            <select id="venue" name="venue" required>
                <option value="beach">Beachfront</option>
                <option value="garden">Garden</option>
                <option value="indoor">Indoor Banquet</option>
            </select><br><br>

            <label for="time">Expected Time:</label><br>
            <input type="time" id="time" name="time" required><br><br>

            <label for="requirements">Special Requirements:</label><br>
            <textarea id="requirements" name="requirements" rows="4" cols="10" placeholder="Any specific requirements"></textarea><br><br>
        </form>

        <!-- New Form for Redirect -->
        <form action="indexpop.html" method="GET">
            <input type="submit" value="Book Now">
        </form>
    </div>
<span id="response"> 
</span>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('img/image6.jpg');
            color: #444444;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }    

        .container {
            width: 50%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0px 20px 30px rgba(0, 0, 0, 0.356);
            background-color: rgba(255, 255, 255, 0);
            border-radius: 15px;
            border: none;
            margin-top: 20px;
        }

        .back-button {
            display: inline-block;
            padding: 5px 12px;
            margin: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #becbbe;
            background-color: rgb(198, 46, 69);
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color: rgb(90, 4, 4);
        }

        h1 {
            text-align: center;
            color: rgb(232, 49, 77);
            font-size: 24px;
            margin-bottom: 20px;
        }
    
        label {
            color: rgb(232, 49, 77);
            font-size: 16px;
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
        }
    
        input[type="text"],
        input[type="date"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="submit"] {
          background-color: rgb(198, 46, 69);
          color: rgb(10, 10, 10);
          padding: 9px 7px;
          border: none;
          border-radius: 15px;
          cursor: pointer;
          font-size: 20px;
          font-weight: bold;
          transition: background-color 0.03s ease;
          display: block;
          margin: 20px auto;
        }

        input[type="submit"]:hover {
            background-color: rgb(90, 4, 4);
        }
    
        textarea {
            resize: vertical;
            height: 100px;
            font-family: 'Arial', sans-serif;
        }
    
        /* Query for Mobile */
        @media (max-width: 480px) {
            .container {
                width: 90%;
            }
        }
    </style>
    
    <script>
        const dateInput = document.getElementById('date');
dateInput.addEventListener('change', (event) => {
    const dateValue = event.target.value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
        alert('Please enter the date in yyyy-mm-dd format.');
    }
});

function send_Data() {
    var event = document.getElementById("event").value;
    var name = document.getElementById("name").value;
    var date = document.getElementById("date").value;
    var guests = document.getElementById("guests").value;
    var venue = document.getElementById("venue").value;
    var time = document.getElementById("time").value;
    var requirements = document.getElementById("requirements").value;

    fetch('./aj_f/get_data.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: `event=${event}&name=${name}&date=${date}&guests=${guests}&venue=${venue}&time=${time}&requirements=${requirements}`
    })
    .then(response => response.text())
    .then(data => document.getElementById("response").innerHTML = data)
    .catch(error => console.error('Error:', error));
}
    </script>
</body>
</html>
